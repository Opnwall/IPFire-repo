<!DOCTYPE HTML>
<html lang="<TMPL_VAR NAME="HTML_LANGUAGE">">
	<head>
		<meta charset="UTF-8">
		<title><TMPL_VAR NAME="TITLE"></title>

		<link rel="stylesheet" href="../assets/bootstrap-reboot.min.css">
		<link rel="stylesheet" href="../assets/bootstrap-grid.min.css">
		<link rel="stylesheet" href="../assets/captive.css?v=1.1.8-coupon-center">

		<TMPL_IF NAME="COLOR">
			<style>
				.box-block {
					background-color: <TMPL_VAR NAME="COLOR">;
				}

				/* Finestre apribili e richiudibili */
				.terms-window {
					margin-top: 15px;
					border: 1px solid #ccc;
					border-radius: 5px;
					overflow: hidden;
				}

				.terms-window summary {
					padding: 12px 15px;
					cursor: pointer;
					font-weight: bold;
					background-color: #f0f0f0;
				}

				.terms-window summary:hover {
					background-color: #e4e4e4;
				}

				.terms-content {
					padding: 15px;
					max-height: 300px;
					overflow-y: auto;
					overflow-wrap: anywhere;
					background-color: #fff;
					border-top: 1px solid #ccc;
				}
			</style>
		</TMPL_IF>

		<meta name="viewport"
			content="width=device-width, initial-scale=1, shrink-to-fit=no">
	</head>

	<body>
		<div class="container content">
			<div class="row">
				<div class="col-12 col-lg-10 offset-lg-1 col-xl-8 offset-xl-2">
					<div class="box">

						<div class="box-header">
                            <img class="portal-logo" src="<TMPL_VAR NAME="LOGO_URL">" alt="<TMPL_VAR NAME="TITLE">">
							<h1><TMPL_VAR NAME="TITLE"></h1>
						</div>

						<form action="" method="GET" style="margin: 0 0 16px; text-align: right;">
                            <input type="hidden" name="redirect" value="<TMPL_VAR NAME="REDIRECT">">
                            <label for="visitor-language"><TMPL_VAR NAME="L_LANGUAGE"></label>
                            <select id="visitor-language" name="language"><TMPL_VAR NAME="LANGUAGE_OPTIONS"></select>
                            <button type="submit"><TMPL_VAR NAME="L_SWITCH"></button>
                        </form>
                        <div class="box-block">
							<TMPL_UNLESS NAME="COUPON"><h4><TMPL_VAR NAME="L_HEADING"></h4></TMPL_UNLESS>

							<form action="" method="POST"<TMPL_IF NAME="COUPON"> class="coupon-form"</TMPL_IF>>
								<input type="hidden" name="ACTION" value="SUBMIT">
                                <input type="hidden" name="language" value="<TMPL_VAR NAME="LANGUAGE">">
                                <input type="hidden" name="CSRF_TOKEN" value="<TMPL_VAR NAME="CSRF_TOKEN">">
								<input type="hidden" name="redirect"
									value="<TMPL_VAR NAME="REDIRECT">">

								<TMPL_IF NAME="COUPON">
									<div class="coupon-controls">
									<input
										class="form-text <TMPL_IF NAME="ERROR">form-error</TMPL_IF>"
										type="text" name="COUPON" aria-label="<TMPL_VAR NAME="L_COUPON_HINT">" placeholder="<TMPL_VAR NAME="L_COUPON_HINT">">

									<input class="form-submit" type="submit"
										value="<TMPL_VAR NAME="L_ACTIVATE">">
									</div>
								<TMPL_ELSE>
									<div class="checkbox">
										<label>
											<input
												class="form-checkbox <TMPL_IF NAME="ERROR">error</TMPL_IF>"
												type="checkbox" name="TERMS">
											<TMPL_VAR NAME="L_AGREE_TERMS">
										</label>
									</div>

									<input class="form-submit" type="submit"
										value="<TMPL_VAR NAME="L_GAIN_ACCESS">">
								</TMPL_IF>

								<TMPL_IF NAME="ERROR">
									<div class="text-error">
										<TMPL_VAR NAME="ERROR">
									</div>
								</TMPL_IF>
							</form>
						</div>

						<TMPL_IF NAME="TERMS">
							<details class="terms-window">
								<summary><TMPL_VAR NAME="L_TERMS"></summary>
								<div class="terms-content">
									<TMPL_VAR NAME="TERMS">
								</div>
							</details>
						</TMPL_IF>

					</div>
				</div>
			</div>
		</div>

		<footer>
			<div class="container">
				<div class="footer">
					<img class="logo" src="/assets/ipfire.png" alt="IPFire">
						
				</div>
			</div>
		</footer>
	</body>
</html>
